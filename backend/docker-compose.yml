version: "3.9"

services:
  gateway:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api-execute
      - ai-dialer
      - callback-manual
      - tasks
      - canales-service

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: sudamerica_ai
      POSTGRES_USER: sudamerica
      POSTGRES_PASSWORD: sudamerica_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql
      - ./infra/002_rls_policies.sql:/docker-entrypoint-initdb.d/002_rls_policies.sql
      - ./infra/003_indexes.sql:/docker-entrypoint-initdb.d/003_indexes.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sudamerica"]
      interval: 5s
      timeout: 5s
      retries: 5

  api-execute:
    build: ./api_execute
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
    env_file:
      - ./api_execute/.env
    depends_on:
      postgres:
        condition: service_healthy

  ai-dialer:
    build: ./AI_dialer
    ports:
      - "8001:8001"
    environment:
      PORT: 8001
    env_file:
      - ./AI_dialer/.env
    depends_on:
      postgres:
        condition: service_healthy

  callback-manual:
    build: ./callback_manual
    ports:
      - "8002:8002"
    environment:
      PORT: 8002
    env_file:
      - ./callback_manual/.env
    depends_on:
      postgres:
        condition: service_healthy

  tasks:
    build: ./tasks
    ports:
      - "8003:8003"
    environment:
      PORT: 8003
    env_file:
      - ./tasks/.env
    depends_on:
      postgres:
        condition: service_healthy

  canales-service:
    build: ./canales_service
    ports:
      - "8004:8004"
    environment:
      PORT: 8004
    env_file:
      - ./canales_service/.env
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
