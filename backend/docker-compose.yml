version: "3.9"

services:
  gateway:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api-execute
      - callback-manual
      - tasks
      - canales-service

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: sudamerica_ai
      POSTGRES_USER: sudamerica
      # Rotated local password — set POSTGRES_PASSWORD in backend/.env (gitignored).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in backend/.env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Apply the FULL infra/*.sql chain on first init (000_ runs before the rest).
      # The chain includes columns absent from 001/002/003 (e.g. debounce_seconds
      # from infra/012). See infra/init-local-db.sh.
      - ./infra:/infra:ro
      - ./infra/init-local-db.sh:/docker-entrypoint-initdb.d/000_init-local-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sudamerica"]
      interval: 5s
      timeout: 5s
      retries: 5

  api-execute:
    build: ./api_execute
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      SERVICE_OPEN_AGENT_URL: http://open-agent:8005
    env_file:
      - ./api_execute/.env
    depends_on:
      postgres:
        condition: service_healthy
      open-agent:
        condition: service_started

  callback-manual:
    build: ./callback_manual
    ports:
      - "8002:8002"
    environment:
      PORT: 8002
    env_file:
      - ./callback_manual/.env
    depends_on:
      postgres:
        condition: service_healthy

  tasks:
    build: ./tasks
    ports:
      - "8003:8003"
    environment:
      PORT: 8003
    env_file:
      - ./tasks/.env
    depends_on:
      postgres:
        condition: service_healthy

  canales-service:
    build: ./canales_service
    ports:
      - "8004:8004"
    environment:
      PORT: 8004
    env_file:
      - ./canales_service/.env
    depends_on:
      postgres:
        condition: service_healthy

  open-agent:
    build: ./open_agent
    ports:
      - "8005:8005"
    environment:
      PORT: 8005
    env_file:
      - ./open_agent/.env

volumes:
  pgdata:
