upstream api_execute  { server api-execute:8000;    }
upstream callback     { server callback-manual:8002; }
upstream tasks        { server tasks:8003;           }
upstream canales      { server canales-service:8004; }

server {
    listen 80;
    server_name _;

    # ── api_execute (orquestador) ────────────────────────────────────
    location /api/v1/core/ {
        proxy_pass http://api_execute;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # api_execute admin endpoints
    location /api/v1/admin/ {
        proxy_pass http://api_execute;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # api_execute public endpoints (QR, etc.)
    location /api/v1/public/ {
        proxy_pass http://api_execute;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # api_execute WebSocket (KDS)
    location /ws/kds/ {
        proxy_pass http://api_execute;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 86400s;
    }

    # ── callback_manual (revision humana) ───────────────────────────
    location /api/v1/reviews/ {
        proxy_pass http://callback;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── tasks (async delivery) ──────────────────────────────────────
    location /api/v1/tasks/ {
        proxy_pass http://tasks;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── canales_service (WhatsApp) ──────────────────────────────────
    location /api/v1/canales/ {
        proxy_pass http://canales;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Health checks ───────────────────────────────────────────────
    location = /health {
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }
}
