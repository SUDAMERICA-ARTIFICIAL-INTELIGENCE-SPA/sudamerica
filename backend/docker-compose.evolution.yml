services:
  evolution-api:
    container_name: evolution_api
    image: atendai/evolution-api:v2.3.7
    restart: unless-stopped
    ports:
      - "8085:8085"
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - backend_default
    environment:
      SERVER_URL: "http://localhost:8085"
      SERVER_TYPE: http
      SERVER_PORT: "8085"

      AUTHENTICATION_TYPE: apikey
      AUTHENTICATION_API_KEY: sudamerica-evo-dev-key
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"

      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: "postgresql://postgres:postgres@happycel-postgres:5432/evolution_db?schema=public"
      DATABASE_CONNECTION_CLIENT_NAME: evolution_v2
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      DATABASE_SAVE_DATA_LABELS: "true"
      DATABASE_SAVE_DATA_HISTORIC: "true"

      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: "redis://evolution-redis:6379/0"
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_REDIS_SAVE_INSTANCES: "false"

      # -- WhatsApp Business Cloud API (Meta oficial) --
      # Token para verificar webhooks de Meta (challenge handshake)
      WA_BUSINESS_TOKEN_WEBHOOK: "${WA_BUSINESS_TOKEN_WEBHOOK:-sudamerica-meta-webhook-verify}"

      WEBHOOK_GLOBAL_ENABLED: "false"
      DEL_INSTANCE: "false"
      LOG_LEVEL: "ERROR,WARN,DEBUG,INFO,LOG,VERBOSE,DARK,WEBHOOKS"
    depends_on:
      - evolution-redis

  evolution-redis:
    container_name: evolution_redis
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - evolution_redis:/data
    networks:
      - backend_default

volumes:
  evolution_instances:
  evolution_redis:

networks:
  backend_default:
    external: true
