name: Vitrina (GitHub Pages)

# Publica la vitrina demo (export estático del frontend, modo showroom) en
# GitHub Pages. El build real (output: "standalone") NO se ve afectado: aquí
# se activa el modo export sólo vía STATIC_EXPORT=1.
#
# URL: https://sudamerica-artificial-inteligence-spa.github.io/sudamerica/

on:
  push:
    branches: [paso7-dashboard-canonico]
  workflow_dispatch:

# Permite un único deploy concurrente; no cancela el que está en curso.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Build (export estático)
        env:
          STATIC_EXPORT: "1"
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
